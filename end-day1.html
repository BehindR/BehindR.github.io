<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.jpeg">
  <title>Girlfriend Day — Prank 🤍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg1:#220a2b;
      --bg2:#5b2146;
      --bg3:#b64f73;
      --text:#fff;
      --dark:#4f2740;
      --rose:#b54673;
      --rose2:#7a2d5e;
      --shadow:0 25px 80px rgba(25,0,20,.38);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      min-height:100vh;
      overflow-x:hidden;
      font-family:Poppins,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 180, 205, .35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(173, 136, 255, .3), transparent 32%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 52%, var(--bg3));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .bg-blur{position:fixed; width:320px; height:320px; border-radius:50%; filter:blur(85px); opacity:.45; pointer-events:none; z-index:0}
    .blur-1{top:-100px; left:-80px; background:#ff9bbc}
    .blur-2{right:-110px; bottom:-90px; background:#b69cff}
    .stars{position:fixed; inset:0; pointer-events:none; z-index:0}
    .star{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.7; animation: twinkle 2.8s infinite alternate ease-in-out}
    @keyframes twinkle{from{transform:scale(.7);opacity:.25}to{transform:scale(1.4);opacity:1}}
    .falling-heart{position:fixed; top:-40px; z-index:15; pointer-events:none; animation: fall linear forwards}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}12%{opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}

    .prank-card{
      width:min(460px,100%);
      position:relative;
      z-index:2;
      padding:38px 26px 32px;
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,243,240,.98));
      color:var(--dark);
      box-shadow:var(--shadow);
      text-align:center;
      animation: pop .8s ease;
      overflow:hidden;
    }
    @keyframes pop{from{opacity:0; transform:translateY(24px) scale(.96)}to{opacity:1; transform:translateY(0) scale(1)}}
    .prank-card::before{content:""; position:absolute; inset:-70px -70px auto auto; width:200px; height:200px; border-radius:50%; background:rgba(232,138,174,.18)}
    .prank-card::after{content:"♡"; position:absolute; right:14px; bottom:-18px; font-family:"Dancing Script",cursive; font-size:9rem; color:rgba(173,63,110,.12); transform:rotate(-15deg)}
    .emoji{font-size:4rem; margin-bottom:12px}
    .title{font-family:"Dancing Script",cursive; font-size:clamp(2.7rem,8vw,4.2rem); color:#a53868; line-height:1.05; margin-bottom:10px}
    .subtitle{font-size:.8rem; letter-spacing:2px; text-transform:uppercase; color:#9c6e80; margin-bottom:22px}
    .prank-text{font-size:.98rem; line-height:1.9; color:#694655}
    .prank-box{
      margin-top:22px;
      padding:22px 18px;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(184,71,112,.08), rgba(122,45,94,.06));
      border:1px solid rgba(165,56,104,.12);
      text-align:center;
    }
    .big{font-family:"Dancing Script",cursive; font-size:2.15rem; color:#8e3055; margin-bottom:8px}
    .countdown{margin-top:12px; font-size:1rem; font-weight:700; color:#8e3055}
    .tiny{margin-top:12px; font-size:.8rem; opacity:.72}
    .locked-badge{display:inline-flex; align-items:center; gap:8px; justify-content:center; padding:10px 15px; border-radius:999px; background:rgba(126,45,94,.11); color:#7f2f57; font-weight:700; font-size:.88rem; margin-top:14px}
    .btn-row{margin-top:18px}
    .btn-locked{display:inline-flex; align-items:center; gap:8px; padding:14px 22px; border-radius:999px; border:0; background:#d7c6cf; color:#755063; font-weight:700; cursor:not-allowed; box-shadow:0 10px 24px rgba(0,0,0,.12)}
    .music-btn{position:fixed; right:18px; bottom:18px; z-index:50; display:none; width:50px; height:50px; border-radius:50%; border:1px solid rgba(255,255,255,.28); background:rgba(69,17,58,.45); color:#fff; cursor:pointer; backdrop-filter:blur(10px); box-shadow:0 10px 28px rgba(30,0,24,.28)}
    .music-btn.playing{animation: rotate 4s linear infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}

    @media (max-width:520px){
      .prank-card{padding:34px 18px 28px}
      .prank-text{font-size:.93rem}
    }
  </style>
</head>
<body>
  <div class="bg-blur blur-1"></div>
  <div class="bg-blur blur-2"></div>
  <div class="stars" id="stars"></div>

  <audio id="bgMusic" loop>
    <source src="lagu-romantis.mp3" type="audio/mpeg" />
  </audio>

  <main class="prank-card" aria-label="Halaman prank">
    <div class="emoji">😏</div>
    <h1 class="title">Kena Prank.</h1>
    <div class="subtitle">Halaman lanjutan</div>

    <p class="prank-text">
      Kamu kira challengenya udah beres?
      <br />
      YAAA BELUMM DONGG
      <br /><br />
      Yang selanjutnya baru bakal dibuka <b>besok</b>.
    </p>

    <div class="prank-box">
      <div class="big">Tantangan belum selesai</div>
      <div class="locked-badge">🔒 Dikunci sampai besok</div>
      <div class="countdown" id="countdown">Sisa waktu: menghitung...</div>
      <div class="tiny">Sengaja dibikin biar azka penasaran semalaman 🤍</div>
      <div class="btn-row">
        <button class="btn-locked" type="button">Masih belum bisa dibuka</button>
      </div>
    </div>
  </main>

  <button class="music-btn" id="musicBtn" aria-label="Musik">♪</button>

  <script>
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');
    const countdown = document.getElementById('countdown');

    function createStars(count = 60) {
      const container = document.getElementById('stars');
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = Math.random() * 3 + 's';
        frag.appendChild(s);
      }
      container.appendChild(frag);
    }

    function createHeartRain(amount = 26) {
      const symbols = ['🤍', '♡', '💗', '💕'];
      for (let i = 0; i < amount; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'falling-heart';
          heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.fontSize = Math.random() * 18 + 14 + 'px';
          heart.style.animationDuration = Math.random() * 3 + 4 + 's';
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 8000);
        }, i * 90);
      }
    }

    function playMusic() {
      bgMusic.play().then(() => {
        musicBtn.style.display = 'flex';
        musicBtn.classList.add('playing');
        musicBtn.textContent = '♫';
      }).catch(() => {
        musicBtn.style.display = 'flex';
      });
    }

    function getTomorrowText() {
      const now = new Date();
      const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
      const diff = tomorrow - now;
      const hours = Math.floor(diff / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      return `${hours} jam ${mins} menit ${secs} detik lagi`;
    }

    function updateCountdown() {
      countdown.textContent = 'Sisa waktu: ' + getTomorrowText();
    }

    createStars();
    createHeartRain();
    playMusic();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
